{% extends "students/base.html" %}
{% block title %}
    O'chirish
{% endblock %}
{% block content %}
    <main class="container">
        <section class="confirm-card">
            <p class="eyebrow">Delete</p>
            <h1>{{ student.fullname }} o‘chirilsinmi?</h1>
            <div class="button-row">
                <a class="button" href="{% url 'students_list' %}">Bekor qilish</a>
                <form method="post" action="{% url 'delete' student.pk %}">
                    {% csrf_token %}
                    <button type="submit" class="button button--danger">
                        Ha, o‘chirish
                    </button>
                </form>
            </div>
        </section>
    </main>
{% endblock %}
