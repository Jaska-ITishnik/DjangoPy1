{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static "apps/css/styles.css" %}">
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css'>
</head>
<body>
<section id="team" class="team_member section-padding">
    <div class="container">
        <div class="section-title text-center">
            <h1>Meet our experts</h1>
            <p>It is a long established fact that a reader will be distracted by the readable content of a page when
                looking at its layout.</p>
        </div>
        <div class="row text-center">
            {% for key, person in people.items %}
                <div class="col-md-3 col-sm-6 col-xs-12 wow fadeInUp" data-wow-duration="1s" data-wow-delay="0.1s"
                     data-wow-offset="0">
                    <div class="our-team">
                        <div class="team_img">
                            <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="team-image">
                            <ul class="social">
                                <li><a href="#"><i class="fa fa-facebook"></i></a></li>
                                <li><a href="#"><i class="fa fa-twitter"></i></a></li>
                                <li><a href="#"><i class="fa fa-linkedin"></i></a></li>
                                <li><a href="#"><i class="fa fa-instagram"></i></a></li>
                            </ul>
                        </div>
                        <div class="team-content">
                            <h3 class="title">{{ person.fullname }}</h3>
                            <span class="post">{{ person.profession }}</span>
                        </div>
                    </div>
                </div><!--- END COL -->
            {% endfor %}
            <div class="col-md-3 col-sm-6 col-xs-12">
            </div><!--- END COL -->
        </div><!--- END ROW -->
    </div><!--- END CONTAINER -->
</section>
<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js'></script>
</body>
</html>
